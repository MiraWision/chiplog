name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first red version cancels the rest and hides whether
      # the failure is version-specific — which is exactly the question.
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
