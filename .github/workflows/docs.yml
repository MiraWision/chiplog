# Rebuilds chiplog.dev and publishes it to the gh-pages branch.
#
# Branch-based rather than actions/deploy-pages: the Pages site is configured
# with build_type "legacy", and `npm run deploy` from a laptop pushes to the same
# branch. One target means a manual deploy and an automated one cannot disagree
# about which is live.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Never let two deploys race for the branch; the newer build wins.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs

      # The export must carry CNAME and .nojekyll or Pages drops the custom
      # domain and refuses to serve the _next directory.
      - name: Assert the export is complete
        run: |
          set -euo pipefail
          for f in CNAME .nojekyll index.html docs/quick-start/index.html og-image.png; do
            test -e "docs/out/$f" || { echo "missing from export: $f"; exit 1; }
          done
          echo "export looks complete"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/out
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: "docs: ${{ github.event.head_commit.message || 'manual deploy' }}"
