<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="630" fill="#0b0b0d"/>

  <g transform="translate(0,26)">
  <!-- Left: scattered lines, deliberately unreadable as a group. -->
  <g fill="#3f3f46">
    <rect x="80" y="300" width="330" height="9" rx="4"/>
    <rect x="80" y="326" width="286" height="9" rx="4"/>
    <rect x="80" y="352" width="352" height="9" rx="4"/>
    <rect x="80" y="378" width="240" height="9" rx="4"/>
    <rect x="80" y="404" width="318" height="9" rx="4"/>
    <rect x="80" y="430" width="272" height="9" rx="4"/>
    <rect x="80" y="456" width="340" height="9" rx="4"/>
  </g>
  <rect x="80" y="482" width="300" height="9" rx="4" fill="#be123c" opacity="0.75"/>
  <text x="80" y="272" fill="#71717a" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">BEFORE</text>

  <!-- Arrow. -->
  <path d="M520 396h64" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
  <path d="M574 386l12 10-12 10" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right: one record. -->
  <rect x="694" y="292" width="426" height="207" rx="14" fill="#161618" stroke="#27272a" stroke-width="2"/>
  <g fill="#5eead4">
    <rect x="722" y="318" width="230" height="9" rx="4"/>
    <rect x="722" y="344" width="150" height="9" rx="4" opacity="0.65"/>
    <rect x="722" y="370" width="290" height="9" rx="4" opacity="0.65"/>
    <rect x="722" y="396" width="256" height="9" rx="4" opacity="0.65"/>
    <rect x="722" y="422" width="310" height="9" rx="4" opacity="0.65"/>
    <rect x="722" y="448" width="196" height="9" rx="4" opacity="0.65"/>
  </g>
  <rect x="694" y="292" width="4" height="207" rx="2" fill="#5eead4"/>
  <text x="694" y="272" fill="#5eead4" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">AFTER</text>
  </g>

  <!-- Wordmark. -->
  <g transform="translate(80,88) scale(1.625)">
    <rect width="32" height="32" rx="7" fill="#0f766e"/>
    <path d="M7.2 4.6h17.6a1.8 1.8 0 0 1 0 3.6h-1.4c-2.2 2.6-2.2 12.4 0 15h1.4a1.8 1.8 0 0 1 0 3.6H7.2a1.8 1.8 0 0 1 0-3.6h1.4c2.2-2.6 2.2-12.4 0-15H7.2a1.8 1.8 0 0 1 0-3.6z" fill="#99f6e4"/>
    <g stroke="#0f766e" stroke-width="1.9" stroke-linecap="round"><path d="M9.3 13.4h13.4M9.3 18.6h13.4"/></g>
  </g>
  <text x="148" y="128" fill="#fafafa" font-size="42" font-weight="600" letter-spacing="-1">chiplog</text>

  <text x="80" y="200" fill="#d4d4d8" font-size="34" font-weight="500" letter-spacing="-0.5">One wide log event per operation,</text>
  <text x="80" y="240" fill="#71717a" font-size="34" font-weight="500" letter-spacing="-0.5">instead of scattered lines you have to reassemble.</text>

  <text x="80" y="570" fill="#71717a" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm install chiplog</text>
  <text x="1120" y="570" fill="#52525b" font-size="21" text-anchor="end">chiplog.dev</text>
</svg>
